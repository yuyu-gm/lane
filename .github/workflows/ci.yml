name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows native and installation checks
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      RUSTUP_TOOLCHAIN: 1.90.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Set up Rust
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
          if ($LASTEXITCODE -ne 0) { throw 'Rust toolchain setup failed' }
      - name: Build, test and package
        run: ./scripts/build.ps1
      - name: Run documented demo
        run: |
          python -X utf8 examples/demo.py --lane ./target/release/lane.exe
          if ($LASTEXITCODE -ne 0) { throw 'Demo failed' }
      - name: Check whitespace
        run: |
          git show --format= --check HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace check failed' }
      - name: Upload verified Windows bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lane-windows-x64-${{ github.sha }}
          path: |
            dist/lane-*/lane.exe
            dist/lane-*/LANE.md
            dist/lane-*/schema.json
            dist/lane-*/LICENSE
            dist/lane-*/install.ps1
            dist/lane-*/INSTALL.md
            dist/lane-*/SHA256SUMS.json
          if-no-files-found: error
          retention-days: 14
