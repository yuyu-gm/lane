[package]
name = "lane-native"
version = "0.4.0"
edition = "2024"
rust-version = "1.90"
description = "Git worktree lifecycle and integration checks for parent coding agents"
license = "MIT"
readme = "README.md"

[[bin]]
name = "lane"
path = "src/main.rs"

[dependencies]
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
